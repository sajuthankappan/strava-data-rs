[package]
name = "strava-data"
version = "0.8.1"
authors = ["Saju Thankappan <sajuthankappan@gmail.com>"]
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Strava data api bindings"
homepage = "https://github.com/sajuthankappan/strava-data-rs"
repository = "https://github.com/sajuthankappan/strava-data-rs"
readme = "README.md"
keywords = ["strava"]
categories = ["api-bindings"]

[dependencies]
log = "0.4.8"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "query", "system-proxy"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "2.0.20"

[features]
default = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]

[dev-dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.3"
tokio = { version = "1.36.0", features = ["macros"] }
wiremock = "0.6.5"
